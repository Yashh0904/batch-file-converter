services:
  app:
    build: .
    container_name: batch-uploader-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-secret}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-batch-media}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      - redis
      - postgres
      - seaweedfs
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    "command": redis-server --appendonly yes
    "volumes":
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"    
    volumes:
      - postgres-data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333" # S3 API endpoint
      - "9333:9333" # Web Admin UI
    command: "server -dir=/data -s3"
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-admin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-secret}
    volumes:
      - seaweedfs-data:/data


volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local